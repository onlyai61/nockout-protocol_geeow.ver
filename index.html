<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NOCKOUT Protocol</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 20%, rgba(83, 228, 255, 0.18), transparent 34%),
          #05070b;
        color: #f5f8ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      .screen {
        width: min(560px, 100%);
        padding: 28px;
        border: 1px solid rgba(234, 242, 255, 0.18);
        border-radius: 8px;
        background: rgba(8, 13, 22, 0.78);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.42);
      }

      .title-screen {
        display: grid;
        min-height: 360px;
        place-items: center;
        text-align: center;
        cursor: pointer;
      }

      .game-ui {
        display: none;
      }

      .is-started .title-screen {
        display: none;
      }

      .is-started .game-ui {
        display: block;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 14px;
        color: #aab8ca;
        line-height: 1.55;
      }

      .touch-text {
        margin-top: 28px;
        color: #53e4ff;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      a,
      .google-login {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: #53e4ff;
        color: #041018;
        font-weight: 800;
        text-decoration: none;
      }

      .google-login {
        gap: 8px;
        background: #f5f8ff;
        cursor: not-allowed;
      }

      .google-mark {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 50%;
        background: #ffffff;
        color: #041018;
        font-weight: 900;
      }

      .notice {
        margin-top: 12px;
        font-size: 13px;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.46;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section class="screen title-screen" aria-label="타이틀 화면">
        <div>
          <h1>NOCKOUT Protocol</h1>
          <p>쓰레기장에서 태어난 고철 로봇이 챔피언을 향해 올라갑니다.</p>
          <div class="touch-text">TOUCH THE SCREEN</div>
        </div>
      </section>

      <section class="screen game-ui" aria-label="메인 UI">
        <h1>NOCKOUT Protocol Demo Reset</h1>
        <p>이전 WebGL 데모 빌드는 제거되었습니다. 지금은 새 타이틀 화면과 UI 방향으로 다시 진행합니다.</p>
        <div class="actions">
          <button class="google-login" type="button" aria-disabled="true">
            <span class="google-mark">G</span>
            Google로 로그인
          </button>
          <a href="https://onlyai61.github.io/nockout-protocol/">새 와이어프레임 보기</a>
        </div>
        <p class="notice">로그인 기능은 아직 구현하지 않았습니다.</p>
      </section>
    </main>

    <script>
      const app = document.querySelector("#app");
      const titleScreen = document.querySelector(".title-screen");
      const googleLogin = document.querySelector(".google-login");

      titleScreen.addEventListener("click", () => {
        app.classList.add("is-started");
      });

      titleScreen.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          app.classList.add("is-started");
        }
      });

      titleScreen.tabIndex = 0;

      googleLogin.addEventListener("click", () => {
        window.alert("Google 로그인은 아직 구현하지 않았습니다.");
      });
    </script>
  </body>
</html>
